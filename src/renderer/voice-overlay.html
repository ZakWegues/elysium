<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>NEUROAXIS</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --purple: #8b5cf6; --purple-dark: #6d28d9;
      --green: #10b981;  --red: #ef4444;
      --bg: #07071a;     --surface: rgba(255,255,255,0.04);
      --border: rgba(139,92,246,0.18);
      --text: #f1f5f9;   --muted: #475569;
    }
    body {
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: space-between;
      padding: 20px 28px 20px;
      overflow: hidden; position: relative;
    }
    body::before {
      content: "";
      position: absolute; top: -80px; left: 50%; transform: translateX(-50%);
      width: 320px; height: 320px; border-radius: 50%;
      background: radial-gradient(circle, rgba(109,40,217,0.18) 0%, transparent 70%);
      pointer-events: none; transition: background 0.6s;
    }
    body.listening::before  { background: radial-gradient(circle, rgba(139,92,246,0.24) 0%, transparent 70%); }
    body.processing::before { background: radial-gradient(circle, rgba(79,70,229,0.2)  0%, transparent 70%); }
    body.speaking::before   { background: radial-gradient(circle, rgba(16,185,129,0.2) 0%, transparent 70%); }
    body.error::before      { background: radial-gradient(circle, rgba(239,68,68,0.15)  0%, transparent 70%); }

    /* ── top bar ── */
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      width: 100%; z-index: 2;
    }
    .wordmark { display: flex; align-items: center; gap: 8px; }
    .wordmark-icon {
      width: 22px; height: 22px; border-radius: 6px;
      background: linear-gradient(135deg, var(--purple-dark), var(--purple));
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 800; color: #fff;
      box-shadow: 0 2px 8px rgba(109,40,217,0.5);
    }
    .wordmark-label { font-size: 12px; font-weight: 600; letter-spacing: 0.06em; color: rgba(241,245,249,0.55); }
    .close-btn {
      width: 26px; height: 26px; border-radius: 8px; border: none;
      background: rgba(255,255,255,0.05); color: var(--muted);
      cursor: pointer; font-size: 16px; line-height: 1;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.2s, color 0.2s;
    }
    .close-btn:hover { background: rgba(239,68,68,0.15); color: #f87171; }

    /* ── orb ── */
    .orb-section {
      display: flex; flex-direction: column; align-items: center; gap: 16px;
      flex: 1; justify-content: center; z-index: 1;
    }
    .orb-stack {
      position: relative; width: 110px; height: 110px;
      display: flex; align-items: center; justify-content: center;
    }
    .orb-ring-outer {
      position: absolute; inset: -16px; border-radius: 50%;
      border: 1.5px solid rgba(139,92,246,0); transition: border-color 0.4s;
    }
    body.listening  .orb-ring-outer { border-color: rgba(139,92,246,0.2); animation: ring-pulse 1.4s ease-out infinite; }
    body.speaking   .orb-ring-outer { border-color: rgba(16,185,129,0.2);  animation: ring-pulse 0.7s ease-out infinite; }
    .orb-ring-spin {
      position: absolute; inset: -8px; border-radius: 50%;
      border: 2px solid transparent;
      border-top-color: #818cf8; border-right-color: rgba(129,140,248,0.4);
      opacity: 0; transition: opacity 0.3s;
    }
    body.processing .orb-ring-spin { opacity: 1; animation: spin 0.9s linear infinite; }
    .orb-glow {
      position: absolute; inset: 0; border-radius: 50%;
      background: var(--purple); filter: blur(22px);
      opacity: 0.3; transition: background 0.5s, opacity 0.5s;
    }
    body.listening  .orb-glow { opacity: 0.45; }
    body.processing .orb-glow { background: #4f46e5; opacity: 0.3; }
    body.speaking   .orb-glow { background: var(--green); opacity: 0.4; }
    body.error      .orb-glow { background: var(--red); opacity: 0.35; }

    #orb {
      position: relative; width: 92px; height: 92px; border-radius: 50%;
      background: linear-gradient(145deg, #4c1d95 0%, #7c3aed 60%, #8b5cf6 100%);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      box-shadow: 0 0 0 1px rgba(139,92,246,0.3), 0 8px 32px rgba(109,40,217,0.4);
      transition: box-shadow 0.4s, background 0.4s, transform 0.2s;
    }
    #orb:hover { transform: scale(1.04); }
    body:not(.idle) #orb { cursor: default; transform: none !important; }
    body.listening  #orb { background: linear-gradient(145deg,#5b21b6,#8b5cf6); box-shadow:0 0 0 1px rgba(139,92,246,0.5),0 8px 40px rgba(109,40,217,0.55); animation:orb-breathe 1.4s ease-in-out infinite; }
    body.processing #orb { background: linear-gradient(145deg,#312e81,#4f46e5); box-shadow:0 0 0 1px rgba(79,70,229,0.4),0 8px 32px rgba(67,56,202,0.4); }
    body.speaking   #orb { background: linear-gradient(145deg,#064e3b,#059669); box-shadow:0 0 0 1px rgba(16,185,129,0.4),0 8px 32px rgba(5,150,105,0.4); }
    body.error      #orb { background: linear-gradient(145deg,#7f1d1d,#dc2626); box-shadow:0 0 0 1px rgba(239,68,68,0.3),0 8px 24px rgba(220,38,38,0.35); }

    .mic-icon { width: 32px; height: 32px; fill: rgba(255,255,255,0.92); transition: opacity 0.3s; }
    body.speaking .mic-icon { opacity: 0; position: absolute; }
    .bars { display:none; align-items:flex-end; gap:5px; height:34px; }
    body.speaking .bars { display:flex; }
    .bar { width:4px; border-radius:4px; background:rgba(255,255,255,0.88); }
    .bar:nth-child(1){animation:bar .8s ease-in-out -.4s  infinite alternate;}
    .bar:nth-child(2){animation:bar .8s ease-in-out -.2s  infinite alternate;}
    .bar:nth-child(3){animation:bar .8s ease-in-out  0s   infinite alternate;}
    .bar:nth-child(4){animation:bar .8s ease-in-out -.15s infinite alternate;}
    .bar:nth-child(5){animation:bar .8s ease-in-out -.35s infinite alternate;}

    #state-label {
      font-size: 11px; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.14em; color: var(--muted); transition: color 0.4s;
    }
    body.listening  #state-label { color: #a78bfa; }
    body.processing #state-label { color: #818cf8; }
    body.speaking   #state-label { color: #34d399; }
    body.error      #state-label { color: #f87171; }

    /* ── cards ── */
    .cards { display:flex; flex-direction:column; gap:8px; width:100%; z-index:1; }
    .card {
      border-radius: 10px; padding: 0 14px; font-size:13px; line-height:1.55;
      opacity:0; max-height:0; overflow:hidden;
      transition: opacity .35s ease, max-height .4s ease, padding .35s ease;
    }
    .card.show { opacity:1; max-height:100px; padding: 10px 14px; }
    #transcript { background:rgba(109,40,217,.1); border:1px solid rgba(109,40,217,.22); color:#c4b5fd; font-style:italic; text-align:center; }
    #reply-box  { background:var(--surface); border:1px solid rgba(255,255,255,.07); color:var(--text); text-align:center; }

    /* ── hint ── */
    #hint { font-size:11px; color:#1e293b; z-index:1; }

    @keyframes orb-breathe  { 0%,100%{transform:scale(1)} 50%{transform:scale(1.06)} }
    @keyframes ring-pulse   { 0%{transform:scale(1);opacity:1} 100%{transform:scale(1.35);opacity:0} }
    @keyframes spin         { to{transform:rotate(360deg)} }
    @keyframes bar          { from{height:6px} to{height:30px} }
  </style>
</head>
<body class="idle" id="body">

  <div class="topbar">
    <div class="wordmark">
      <div class="wordmark-icon">NA</div>
      <span class="wordmark-label">NEUROAXIS</span>
    </div>
    <button class="close-btn" id="closeBtn" title="Fechar">✕</button>
  </div>

  <div class="orb-section">
    <div class="orb-stack">
      <div class="orb-ring-outer"></div>
      <div class="orb-ring-spin"></div>
      <div class="orb-glow"></div>
      <div id="orb">
        <svg class="mic-icon" viewBox="0 0 24 24">
          <path d="M12 1a4 4 0 0 1 4 4v6a4 4 0 0 1-8 0V5a4 4 0 0 1 4-4zm6 9a1 1 0 0 1 2 0 8 8 0 0 1-7 7.938V20h2a1 1 0 0 1 0 2H9a1 1 0 0 1 0-2h2v-2.062A8.001 8.001 0 0 1 4 10a1 1 0 1 1 2 0 6 6 0 0 0 12 0z"/>
        </svg>
        <div class="bars">
          <div class="bar"></div><div class="bar"></div><div class="bar"></div>
          <div class="bar"></div><div class="bar"></div>
        </div>
      </div>
    </div>
    <div id="state-label">Clique para falar</div>
  </div>

  <div class="cards">
    <div id="transcript" class="card"></div>
    <div id="reply-box"  class="card"></div>
  </div>

  <div id="hint">Ctrl+Shift+J</div>

  <script>
    const body       = document.getElementById("body");
    const orb        = document.getElementById("orb");
    const stateLabel = document.getElementById("state-label");
    const transcript = document.getElementById("transcript");
    const replyBox   = document.getElementById("reply-box");
    let   resetTimer = null;

    const labels = {
      idle: "Clique para falar", listening: "Ouvindo…",
      processing: "Processando…", speaking: "Respondendo…", error: "Ocorreu um erro",
    };

    document.getElementById("closeBtn").addEventListener("click", () => window.close());

    function resetCards() {
      transcript.classList.remove("show");
      replyBox.classList.remove("show");
      replyBox.style.cssText = "";
      setTimeout(() => { transcript.textContent = ""; replyBox.textContent = ""; }, 400);
    }

    orb.addEventListener("click", () => {
      if (body.className !== "idle") return;
      if (resetTimer) { clearTimeout(resetTimer); resetTimer = null; resetCards(); }
      window.neuroaxisVoice.startListening();
    });

    window.neuroaxisVoice.onState((state) => {
      body.className = state;
      stateLabel.textContent = labels[state] ?? state;
      if (state === "idle") {
        // Keep cards visible for 3s so user can read the reply
        if (resetTimer) clearTimeout(resetTimer);
        resetTimer = setTimeout(() => { resetCards(); resetTimer = null; }, 3000);
      }
    });

    window.neuroaxisVoice.onTranscript((text) => {
      transcript.textContent = `"${text}"`;
      transcript.classList.add("show");
    });

    window.neuroaxisVoice.onReply((text) => {
      replyBox.textContent = text;
      replyBox.classList.add("show");
    });

    window.neuroaxisVoice.onError((msg) => {
      body.className = "error";
      stateLabel.textContent = labels.error;
      replyBox.style.borderColor = "rgba(239,68,68,0.3)";
      replyBox.style.color = "#f87171";
      replyBox.textContent = msg;
      replyBox.classList.add("show");
    });
  </script>
</body>
</html>
