<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' file: 'unsafe-inline'; connect-src 'none'; object-src 'none'; base-uri 'none'"><title>ELYSIUM Recorder</title></head>
<body>
<script>
  const SILENCE_THRESHOLD = 0.01;
  // Fase 21: acima disto é fala (o limiar de silêncio é 0,01; fala perto do microfone passa de 0,03).
  const FALA_THRESHOLD = 0.03;

  /**
   * 13/11: cada gravação tem o PRÓPRIO estado (pedaços, descarte, timers). Antes era tudo global:
   * uma gravação nova chegando com a anterior ainda aberta (atalho, "Ely", a bolota) zerava a lista
   * de pedaços enquanto a velha continuava escrevendo nela — o áudio ia sem o cabeçalho WebM e a
   * Groq recusava ("invalid_media_file"), e a Ely dizia "sem conexão com o servidor". A velha
   * também nunca parava (microfone aberto). Agora a nova encerra a anterior, descartada.
   */
  let atual = null;
  let geracao = 0;

  function encerrar(g, descartar) {
    if (!g) return;
    if (descartar) g.descartar = true;
    clearTimeout(g.silenceTimer); clearTimeout(g.maxTimer); clearTimeout(g.semFalaTimer);
    g.silenceTimer = g.maxTimer = g.semFalaTimer = null;
    g.parado = true;
    if (g.recorder && g.recorder.state !== "inactive") g.recorder.stop();
    else if (g.stream) { g.stream.getTracks().forEach((t) => t.stop()); if (g.ctx && g.ctx.state !== "closed") g.ctx.close(); }
    if (atual === g) atual = null;
  }

  window.elysium.onStartRecording(async (cfg) => {
    // Uma gravação aberta (ou abrindo) não pode se misturar com a nova: sai descartada.
    encerrar(atual, true);
    const minha = ++geracao;
    const g = { chunks: [], descartar: false, parado: false, recorder: null, stream: null, ctx: null,
      silenceTimer: null, maxTimer: null, semFalaTimer: null, ouviuFala: false, esperarFala: Number(cfg.esperarFalaMs) > 0 };
    atual = g;

    let stream;
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
    } catch (e) {
      if (minha === geracao) window.elysium.sendError("Microfone: " + e.message);
      return;
    }
    g.stream = stream;
    // Outra gravação começou (ou esta foi cancelada) enquanto o microfone abria.
    if (minha !== geracao || g.parado) { stream.getTracks().forEach((t) => t.stop()); return; }

    g.ctx = new AudioContext();
    const analyser = g.ctx.createAnalyser();
    analyser.fftSize = 512;
    g.ctx.createMediaStreamSource(stream).connect(analyser);

    const mimeType = MediaRecorder.isTypeSupported("audio/webm;codecs=opus") ? "audio/webm;codecs=opus" : "audio/webm";
    const recorder = new MediaRecorder(stream, { mimeType });
    g.recorder = recorder;
    recorder.ondataavailable = (e) => { if (e.data.size > 0) g.chunks.push(e.data); };
    recorder.onstop = async () => {
      stream.getTracks().forEach((t) => t.stop());
      if (g.ctx.state !== "closed") g.ctx.close();
      if (g.descartar || !g.chunks.length) return;
      const buf = await new Blob(g.chunks, { type: mimeType }).arrayBuffer();
      window.elysium.sendAudio(buf);
    };
    recorder.start(100);

    const freqData = new Uint8Array(analyser.frequencyBinCount);
    let lastLevelSend = 0;
    function checkSilence() {
      if (g.parado || recorder.state === "inactive") return;
      analyser.getByteTimeDomainData(freqData);
      let sum = 0;
      for (const v of freqData) sum += Math.abs(v - 128);
      const rms = sum / freqData.length / 128;

      // Throttle audio level IPC to ~30fps
      const now = performance.now();
      if (now - lastLevelSend > 33) {
        window.elysium.sendAudioLevel(rms);
        lastLevelSend = now;
      }

      // Fase 21 (modo live): com `esperarFalaMs`, o silêncio só conta DEPOIS que ele começou a
      // falar — senão a gravação parava em 2,5 s de nada e o Whisper inventava uma frase.
      if (rms >= FALA_THRESHOLD && !g.ouviuFala) { g.ouviuFala = true; clearTimeout(g.semFalaTimer); g.semFalaTimer = null; }
      if (rms < SILENCE_THRESHOLD) {
        if (!g.silenceTimer && (g.ouviuFala || !g.esperarFala)) g.silenceTimer = setTimeout(() => encerrar(g, false), cfg.silenceMs);
      } else {
        clearTimeout(g.silenceTimer);
        g.silenceTimer = null;
      }
      requestAnimationFrame(checkSilence);
    }
    requestAnimationFrame(checkSilence);

    g.maxTimer = setTimeout(() => encerrar(g, false), cfg.maxRecordMs);
    // Ninguém falou no prazo: descarta o áudio e avisa "nada".
    if (g.esperarFala) g.semFalaTimer = setTimeout(() => { encerrar(g, true); window.elysium.sendNada?.(); }, cfg.esperarFalaMs);
  });

  // Fase 21: sair do modo live no meio da escuta — para sem mandar o áudio.
  window.elysium.onCancel?.(() => { encerrar(atual, true); });
  // Fase 22: Espaço solto no push-to-talk — para e manda.
  window.elysium.onFinish?.(() => { encerrar(atual, false); });
</script>
<script>
  // 12/11: a voz do VoiceStudio toca aqui, por Web Audio: os pedaços de PCM16 entram numa linha
  // do tempo só (sem buraco entre eles), e quando o último pedaço de uma fala termina o main fica
  // sabendo. Parar cala tudo na hora.
  let ctxVoz = null;
  let fimDaLinha = 0;
  const tocando = new Set();
  const falas = new Map(); // id → { ultimo: AudioBufferSourceNode | null, fechada: boolean }
  function contexto() {
    if (!ctxVoz || ctxVoz.state === "closed") { ctxVoz = new AudioContext({ latencyHint: "interactive" }); fimDaLinha = 0; }
    if (ctxVoz.state === "suspended") ctxVoz.resume();
    return ctxVoz;
  }
  function terminou(id) {
    const f = falas.get(id);
    if (!f || !f.fechada) return;
    falas.delete(id);
    window.elysium.sendStudioTocou(id);
  }
  window.elysium.onStudioPcm((id, pcm, taxa, ganho) => {
    const c = contexto();
    const bytes = pcm instanceof Uint8Array ? pcm : new Uint8Array(pcm);
    const n = bytes.length >> 1;
    if (!n) return;
    const dv = new DataView(bytes.buffer, bytes.byteOffset, n * 2);
    const buf = c.createBuffer(1, n, taxa || 24000);
    const canal = buf.getChannelData(0);
    for (let i = 0; i < n; i++) canal[i] = dv.getInt16(i * 2, true) / 32768;
    const fonte = c.createBufferSource();
    fonte.buffer = buf;
    const g = c.createGain();
    g.gain.value = ganho > 0 && ganho <= 1 ? ganho : 1;
    fonte.connect(g).connect(c.destination);
    // Um respiro de 40 ms na primeira, para o começo não sair cortado.
    const quando = Math.max(c.currentTime + 0.04, fimDaLinha);
    fonte.start(quando);
    fimDaLinha = quando + buf.duration;
    tocando.add(fonte);
    const f = falas.get(id) ?? { ultimo: null, fechada: false, fimEm: 0 };
    f.ultimo = fonte;
    f.fimEm = fimDaLinha;
    falas.set(id, f);
    fonte.onended = () => { tocando.delete(fonte); if (falas.get(id)?.ultimo === fonte) terminou(id); };
  });
  window.elysium.onStudioFim((id) => {
    const f = falas.get(id);
    if (!f) { window.elysium.sendStudioTocou(id); return; }
    f.fechada = true;
    // Já acabou de tocar antes do aviso de fim?
    if (!ctxVoz || ctxVoz.currentTime >= f.fimEm) terminou(id);
  });
  window.elysium.onStudioParar(() => {
    for (const fonte of tocando) { try { fonte.onended = null; fonte.stop(); } catch {} }
    tocando.clear();
    for (const id of falas.keys()) window.elysium.sendStudioTocou(id);
    falas.clear();
    fimDaLinha = 0;
  });
</script>
</body>
</html>
