<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>NEUROAXIS — Chat</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --purple: #8b5cf6; --purple-dark: #6d28d9;
      --bg: #07071a; --surface: #0f0f28; --surface2: #13132e;
      --border: rgba(139,92,246,0.14);
      --text: #f1f5f9; --muted: #94a3b8; --dim: #334155;
    }
    html, body { height: 100%; }
    body { font-family:"Segoe UI",system-ui,sans-serif; background:var(--bg); color:var(--text); display:flex; flex-direction:column; overflow:hidden; }

    /* ── header ── */
    header {
      display:flex; align-items:center; gap:12px;
      padding:12px 16px;
      background:var(--surface); border-bottom:1px solid var(--border);
      flex-shrink:0;
    }
    .avatar {
      width:36px; height:36px; border-radius:9px;
      background:linear-gradient(145deg,#4c1d95,#8b5cf6);
      display:flex; align-items:center; justify-content:center;
      font-size:16px; font-weight:800; color:#fff;
      box-shadow:0 2px 12px rgba(109,40,217,.4); flex-shrink:0;
    }
    .header-info { flex:1; min-width:0; }
    .header-info h1 { font-size:14px; font-weight:700; }
    .header-info p  { font-size:11px; color:var(--muted); margin-top:1px; display:flex; align-items:center; gap:5px; }
    .dot { width:6px;height:6px;border-radius:50%;background:#22c55e;box-shadow:0 0 5px #22c55e; }

    .icon-btn {
      width:32px; height:32px; border-radius:8px; border:none;
      background:transparent; color:var(--dim); cursor:pointer;
      display:flex; align-items:center; justify-content:center;
      transition:background .2s, color .2s; flex-shrink:0;
    }
    .icon-btn:hover { background:rgba(255,255,255,.06); color:var(--muted); }
    .icon-btn svg { width:16px; height:16px; fill:currentColor; }

    /* ── tabs ── */
    .tabs {
      display:flex; border-bottom:1px solid var(--border);
      background:var(--surface); flex-shrink:0;
    }
    .tab {
      flex:1; padding:9px 0; font-size:12px; font-weight:600;
      color:var(--dim); border:none; background:transparent; cursor:pointer;
      border-bottom:2px solid transparent; transition:color .2s, border-color .2s;
      letter-spacing:.03em;
    }
    .tab:hover { color:var(--muted); }
    .tab.active { color:var(--purple); border-bottom-color:var(--purple); }

    /* ── chat panel ── */
    #chat-panel { flex:1; display:flex; flex-direction:column; overflow:hidden; }

    #messages {
      flex:1; overflow-y:auto; padding:16px 14px 8px;
      display:flex; flex-direction:column; gap:10px;
    }
    .row { display:flex; align-items:flex-end; gap:8px; animation:slide-up .2s ease; }
    .row.user   { flex-direction:row-reverse; }
    .row.system { justify-content:center; }
    @keyframes slide-up { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }

    .mini-av {
      width:28px; height:28px; border-radius:7px;
      display:flex; align-items:center; justify-content:center;
      font-size:12px; font-weight:700; flex-shrink:0;
    }
    .row.neuroaxis .mini-av { background:linear-gradient(145deg,#4c1d95,#8b5cf6); color:#fff; }
    .row.user   .mini-av { background:var(--surface2); border:1px solid rgba(255,255,255,.06); color:var(--muted); }

    .bubble {
      max-width:74%; padding:10px 14px;
      font-size:14px; line-height:1.6; word-break:break-word;
    }
    .row.neuroaxis .bubble { background:var(--surface); border:1px solid var(--border); border-radius:14px 14px 14px 4px; color:var(--text); }
    .row.user   .bubble { background:linear-gradient(135deg,#5b21b6,#8b5cf6); border-radius:14px 14px 4px 14px; color:#fff; box-shadow:0 2px 12px rgba(109,40,217,.35); }
    .row.error  .bubble { background:rgba(127,29,29,.2); border:1px solid rgba(239,68,68,.25); border-radius:14px; color:#f87171; }
    .row.system .bubble { background:none; border:none; color:var(--dim); font-size:11px; padding:2px 0; }

    .typing { display:flex; align-items:center; gap:4px; padding:14px; }
    .typing span { width:5px;height:5px;border-radius:50%;background:var(--purple);animation:blink 1.1s ease-in-out infinite; }
    .typing span:nth-child(2){animation-delay:.17s}
    .typing span:nth-child(3){animation-delay:.34s}
    @keyframes blink { 0%,60%,100%{transform:translateY(0);opacity:.35} 30%{transform:translateY(-5px);opacity:1} }

    #input-row {
      display:flex; align-items:center; gap:8px;
      padding:10px 14px 13px;
      border-top:1px solid var(--border); background:var(--bg); flex-shrink:0;
    }
    #input {
      flex:1; padding:11px 16px;
      background:var(--surface); border:1px solid rgba(255,255,255,.07); border-radius:22px;
      color:var(--text); font-size:14px; font-family:inherit; outline:none;
      transition:border-color .2s, box-shadow .2s;
    }
    #input:focus { border-color:rgba(139,92,246,.5); box-shadow:0 0 0 3px rgba(139,92,246,.1); }
    #input:disabled { opacity:.45; }
    #input::placeholder { color:var(--dim); }

    #sendBtn {
      width:40px; height:40px; flex-shrink:0; border-radius:50%;
      background:linear-gradient(135deg,#5b21b6,#8b5cf6); border:none; cursor:pointer;
      display:flex; align-items:center; justify-content:center;
      box-shadow:0 2px 10px rgba(109,40,217,.4);
      transition:transform .15s, opacity .2s, box-shadow .2s;
    }
    #sendBtn:hover:not(:disabled) { transform:scale(1.07); box-shadow:0 4px 16px rgba(109,40,217,.5); }
    #sendBtn:active:not(:disabled) { transform:scale(.94); }
    #sendBtn:disabled { opacity:.35; cursor:default; box-shadow:none; }
    #sendBtn svg { width:16px; height:16px; fill:#fff; margin-left:2px; }

    /* ── frequentes panel ── */
    #freq-panel {
      flex:1; overflow-y:auto; padding:14px 14px 10px;
      display:none; flex-direction:column; gap:6px;
    }
    #freq-panel.visible { display:flex; }

    .freq-empty {
      flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
      gap:10px; color:var(--dim); text-align:center;
    }
    .freq-empty-icon { font-size:32px; opacity:.4; }
    .freq-empty-txt  { font-size:13px; line-height:1.5; }

    .freq-section-label {
      font-size:10px; font-weight:700; text-transform:uppercase;
      letter-spacing:.1em; color:var(--dim); padding:4px 2px 2px;
    }

    .freq-item {
      display:flex; align-items:center; gap:10px;
      padding:10px 14px; border-radius:10px;
      background:var(--surface); border:1px solid var(--border);
      cursor:pointer; transition:background .18s, border-color .18s, transform .12s;
      animation:slide-up .18s ease;
    }
    .freq-item:hover { background:var(--surface2); border-color:rgba(139,92,246,.3); transform:translateX(2px); }
    .freq-item:active { transform:scale(.98); }

    .freq-icon  { font-size:18px; flex-shrink:0; width:24px; text-align:center; }
    .freq-label { flex:1; font-size:13px; color:var(--text); min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .freq-count {
      font-size:11px; font-weight:700; color:var(--purple);
      background:rgba(139,92,246,.12); border-radius:20px;
      padding:2px 8px; flex-shrink:0;
    }

    ::-webkit-scrollbar { width:3px; }
    ::-webkit-scrollbar-thumb { background:rgba(139,92,246,.2); border-radius:3px; }
  </style>
</head>
<body>
  <header>
    <div class="avatar">NA</div>
    <div class="header-info">
      <h1>NEUROAXIS</h1>
      <p><span class="dot"></span> Online</p>
    </div>
    <button class="icon-btn" id="clearBtn" title="Limpar conversa">
      <svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
    </button>
  </header>

  <div class="tabs">
    <button class="tab active" id="tab-chat">💬 Chat</button>
    <button class="tab"        id="tab-freq">⚡ Frequentes</button>
  </div>

  <!-- chat panel -->
  <div id="chat-panel">
    <div id="messages">
      <div class="row system"><div class="bubble">Olá! Como posso ajudar?</div></div>
    </div>
    <div id="input-row">
      <input id="input" type="text" placeholder="Mensagem…" autocomplete="off" spellcheck="false"/>
      <button id="sendBtn" title="Enviar">
        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>
  </div>

  <!-- frequentes panel -->
  <div id="freq-panel"></div>

  <script>
    const msgs      = document.getElementById("messages");
    const input     = document.getElementById("input");
    const sendBtn   = document.getElementById("sendBtn");
    const clearBtn  = document.getElementById("clearBtn");
    const chatPanel = document.getElementById("chat-panel");
    const freqPanel = document.getElementById("freq-panel");
    const tabChat   = document.getElementById("tab-chat");
    const tabFreq   = document.getElementById("tab-freq");
    let typingEl    = null;

    // ── tabs ──────────────────────────────────────────────────────────────────
    function showTab(tab) {
      if (tab === "chat") {
        tabChat.classList.add("active");   tabFreq.classList.remove("active");
        chatPanel.style.display = "flex"; freqPanel.classList.remove("visible");
        input.focus();
      } else {
        tabFreq.classList.add("active");   tabChat.classList.remove("active");
        chatPanel.style.display = "none"; freqPanel.classList.add("visible");
        renderFrequentes();
      }
    }

    tabChat.addEventListener("click", () => showTab("chat"));
    tabFreq.addEventListener("click", () => showTab("freq"));

    // ── frequentes ────────────────────────────────────────────────────────────
    const TYPE_LABELS = { "🎵": "Músicas", "🌐": "Sites", "💻": "Aplicativos" };

    async function renderFrequentes() {
      freqPanel.innerHTML = "";
      const items = await window.neuroaxisChat.getHistory();

      if (!items || items.length === 0) {
        freqPanel.innerHTML = `
          <div class="freq-empty">
            <div class="freq-empty-icon">⚡</div>
            <div class="freq-empty-txt">Nenhum atalho ainda.<br>Use o NEUROAXIS e seus comandos frequentes aparecem aqui.</div>
          </div>`;
        return;
      }

      const groups = {};
      for (const item of items) {
        const icon = item.icon in TYPE_LABELS ? item.icon : "💻";
        if (!groups[icon]) groups[icon] = [];
        groups[icon].push(item);
      }

      for (const [icon, entries] of Object.entries(groups)) {
        const sec = document.createElement("div");
        sec.className = "freq-section-label";
        sec.textContent = TYPE_LABELS[icon];
        freqPanel.appendChild(sec);

        for (const entry of entries) {
          const el = document.createElement("div");
          el.className = "freq-item";
          el.innerHTML = `
            <span class="freq-icon">${entry.icon}</span>
            <span class="freq-label">${entry.label}</span>
            <span class="freq-count">${entry.count}×</span>`;
          el.addEventListener("click", () => {
            showTab("chat");
            input.value = entry.text;
            doSend();
          });
          freqPanel.appendChild(el);
        }
      }
    }

    // ── chat ──────────────────────────────────────────────────────────────────
    const scroll = () => requestAnimationFrame(() => { msgs.scrollTop = msgs.scrollHeight; });

    function addRow(cls, html) {
      const row = document.createElement("div");
      row.className = "row " + cls;
      if (cls !== "system") {
        const av = document.createElement("div"); av.className = "mini-av";
        av.textContent = cls === "user" ? "V" : "NA";
        row.appendChild(av);
      }
      const bub = document.createElement("div"); bub.className = "bubble";
      bub.innerHTML = html; row.appendChild(bub);
      msgs.appendChild(row); scroll(); return row;
    }

    function showTyping() {
      if (typingEl) return;
      const row = document.createElement("div"); row.className = "row neuroaxis";
      const av = document.createElement("div"); av.className="mini-av"; av.textContent="NA";
      const bub = document.createElement("div"); bub.className="bubble";
      bub.innerHTML='<div class="typing"><span></span><span></span><span></span></div>';
      row.appendChild(av); row.appendChild(bub); msgs.appendChild(row); scroll();
      typingEl = row;
    }
    function hideTyping() { typingEl?.remove(); typingEl = null; }

    function setBusy(busy) { input.disabled = busy; sendBtn.disabled = busy; if (!busy) input.focus(); }

    function doSend() {
      const text = input.value.trim(); if (!text) return;
      addRow("user", text); input.value = "";
      setBusy(true); showTyping();
      window.neuroaxisChat.sendMessage(text);
    }

    sendBtn.addEventListener("click", doSend);
    input.addEventListener("keydown", e => { if (e.key === "Enter") doSend(); });

    clearBtn.addEventListener("click", () => {
      msgs.innerHTML = '<div class="row system"><div class="bubble">Conversa reiniciada.</div></div>';
      window.neuroaxisChat.clearHistory();
      input.focus();
    });

    window.neuroaxisChat.onReply(r => { hideTyping(); addRow("neuroaxis", r); setBusy(false); });
    window.neuroaxisChat.onError(m => { hideTyping(); addRow("error",  m); setBusy(false); });
    window.neuroaxisChat.onBusy(()  => { hideTyping(); addRow("system","Processando…"); });

    input.focus();
  </script>
</body>
</html>
