<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' file:; style-src 'self' file: 'unsafe-inline'; frame-src 'self' file:; img-src 'self' file: data:; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Ely</title>
<!-- 12/11: a Ely flutuante (Ctrl+Espaço). Ver src/main/flutuante.ts e dashboard/js/flutuante.js. -->
<style>
  :root {
    --a: #d9b168; --a2: #f2d49b; --b: #9fd8cf; --ink: 16,21,36; --bg: #0a0c14;
    --texto: #eef1f7; --apagado: rgba(238,241,247,0.62);
    --ambar: #f2b44e; --coral: #ff7a6b; --lilas: #b9a3ff; --branco: #f2f4f8;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; background: transparent; overflow: hidden;
    font: 13.5px/1.5 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; color: var(--texto);
    -webkit-font-smoothing: antialiased; user-select: none; }

  /* 13/11: a camada cobre a tela inteira e é transparente; só o que tem .interativo recebe o mouse. */
  #palco { position: absolute; inset: 0; opacity: 0; transition: opacity .16s ease; }
  #palco.aberto { opacity: 1; }
  /* Saindo: tudo some rápido menos a bolota (que faz a animação dela). */
  #palco.fechando #cartoes, #palco.fechando .lado, #palco.fechando #marcas, #palco.fechando #legenda { opacity: 0; transition: opacity .14s ease; }

  /* ── a Ely: a bolota que segue o cursor, com a fala, o estado e o nível do lado ───────── */
  #ely { position: absolute; left: 0; top: 0; width: 0; height: 0; will-change: transform; z-index: 5; }
  .bola { position: absolute; left: -25px; top: -25px; width: 50px; height: 50px; border-radius: 50%; cursor: pointer; }
  /* A bolota é um <canvas> maior que a área de clique: os pontos espalhados passam da bolinha. */
  .bola canvas { position: absolute; left: -35px; top: -35px; width: 120px; height: 120px; pointer-events: none; }
  /* 14/11 (o dono: "igual ao Roamies"): sem botões; o texto colado na bolota. O lado não pega o
     mouse (escondido ele ficava por cima das telas e roubava o clique) — só o campo e o balão visíveis. */
  .lado { position: absolute; left: 29px; top: -15px; display: flex; flex-direction: column; align-items: flex-start; gap: 5px; width: 340px; pointer-events: none; }
  .lado .campo.ve, .lado .balao.ve { pointer-events: auto; }
  #ely.esq .lado { left: auto; right: 29px; align-items: flex-end; }
  #ely.cima .lado { top: auto; bottom: -15px; flex-direction: column-reverse; }
  .linha1 { display: flex; align-items: center; gap: 8px; }
  /* Sem estado nem nível: a linha não ocupa espaço (o texto fica rente à bolota). */
  .linha1:not(:has(.ve)) { display: none; }

  /* O balão da resposta: colado na bolota, o texto chegando aos poucos; rola se for longo. */
  .balao { max-width: 340px; max-height: 230px; overflow-y: auto; border-radius: 16px; padding: 8px 12px;
    background: rgba(var(--ink), .88); border: 1px solid rgba(255,255,255,.11);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.10), 0 8px 22px rgba(0,0,0,.32);
    scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.2) transparent; overscroll-behavior: contain;
    display: none; }
  .balao.ve { display: block; animation: entra .2s cubic-bezier(.2,.9,.3,1.15); }
  #palco.fechando .balao { opacity: 0; transition: opacity .14s ease; }
  #ely.esq .linha1 { flex-direction: row-reverse; }

  /* O que ela está fazendo: o texto novo entra por cima do velho, com um brilho que corre. */
  .estado { position: relative; display: grid; font-size: 12.5px; padding: 5px 11px; border-radius: 999px; white-space: nowrap;
    background: rgba(var(--ink), .82); border: 1px solid rgba(255,255,255,.10); opacity: 0; transform: translateY(3px);
    transition: opacity .18s, transform .18s; min-height: 27px; }
  .estado.ve { opacity: 1; transform: none; }
  .estado .st { grid-area: 1 / 1;
    background: linear-gradient(90deg, var(--apagado) 0%, var(--texto) 42%, var(--a2) 50%, var(--texto) 58%, var(--apagado) 100%);
    background-size: 250% 100%; -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: stEntra .22s ease both, brilhoTexto 1.8s linear infinite; }
  .estado .st.sai { animation: stSai .2s ease both; }
  @keyframes stEntra { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }
  @keyframes stSai { to { opacity: 0; transform: translateY(-5px); } }
  @keyframes brilhoTexto { from { background-position: 120% 0; } to { background-position: -130% 0; } }

  /* O nível da voz: 5 barrinhas que sobem e descem (só transform). */
  .nivel { display: flex; align-items: center; gap: 2.5px; height: 20px; opacity: 0; transition: opacity .15s; }
  .nivel.ve { opacity: 1; }
  .nivel i { display: block; width: 3.5px; height: 20px; border-radius: 2px; background: linear-gradient(var(--a2), var(--b)); transform: scaleY(.15); will-change: transform; }

  .campo { display: none; width: 320px; height: 38px; padding: 0 14px; border-radius: 999px; outline: none;
    background: rgba(var(--ink), .92); border: 1px solid color-mix(in srgb, var(--a) 45%, rgba(255,255,255,.12));
    color: var(--texto); font: inherit; user-select: text; }
  .campo.ve { display: block; animation: entra .2s cubic-bezier(.2,.9,.3,1.15); }
  .campo::placeholder { color: var(--apagado); }

  /* A fala dele: o que já disse (rola para cima) e o que está dizendo agora, ao vivo. */
  .fala { max-width: 340px; border-radius: 16px; padding: 7px 11px; background: rgba(var(--ink), .84); border: 1px solid rgba(255,255,255,.10);
    box-shadow: 0 6px 18px rgba(0,0,0,.3); visibility: hidden; opacity: 0; transform: translateY(4px); transition: opacity .16s, transform .16s, visibility 0s .16s; }
  .fala.ve { visibility: visible; opacity: 1; transform: none; transition: opacity .16s, transform .16s; }
  .fala .rolo { max-height: 118px; overflow-y: auto; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.2) transparent; overscroll-behavior: contain; }
  .fala .linha { color: var(--apagado); font-size: 12.5px; padding: 2px 0; border-bottom: 1px solid rgba(255,255,255,.05); }
  .fala .linha:last-child { border-bottom: 0; }
  #aovivo { color: var(--texto); font-size: 13.5px; padding-top: 2px; }
  #aovivo:empty { display: none; }
  .fala.ouvindo #aovivo:not(:empty)::after { content: ""; display: inline-block; width: 6px; height: 13px; margin-left: 3px; vertical-align: -2px; border-radius: 2px; background: var(--b); animation: pisca 1s steps(2) infinite; }

  /* ── as marcas na tela (o guia de tela): por cima dos programas, sem pegar o mouse ───── */
  #marcas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; z-index: 3; }
  #marcas .anel { fill: none; stroke: var(--a2); stroke-width: 3; filter: drop-shadow(0 0 6px color-mix(in srgb, var(--a) 80%, transparent)); }
  #marcas .tracar { stroke-dasharray: var(--L) var(--L); stroke-dashoffset: var(--L); animation: tracar .55s cubic-bezier(.3,.7,.2,1) forwards; }
  @keyframes tracar { to { stroke-dashoffset: 0; } }
  #marcas .pulsa { animation: tracar .55s cubic-bezier(.3,.7,.2,1) forwards, pulsaMarca 1.6s ease-in-out .6s infinite; }
  @keyframes pulsaMarca { 50% { stroke-width: 5; } }
  #marcas .seta { fill: none; stroke: var(--a2); stroke-width: 3.2; stroke-linecap: round; }
  #marcas .ponta { fill: var(--a2); }
  #marcas .numc { fill: var(--a); stroke: rgba(0,0,0,.35); stroke-width: 1; }
  #marcas .numt { fill: var(--bg); font: 700 13px "Segoe UI", sans-serif; text-anchor: middle; dominant-baseline: central; }
  #marcas .rot rect { fill: rgba(var(--ink), .92); stroke: color-mix(in srgb, var(--a) 60%, transparent); stroke-width: 1; }
  #marcas .rot text { fill: var(--texto); font: 600 12.5px "Segoe UI", sans-serif; dominant-baseline: central; }
  #marcas .sub { stroke: var(--a2); stroke-width: 3; stroke-linecap: round; }
  #marcas .velado { fill: rgba(0,0,0,.45); animation: aparece .3s ease both; }
  #marcas .passo { animation: aparece .25s ease both; }
  #marcas .passo.antigo { opacity: .45; transition: opacity .3s; }
  @keyframes aparece { from { opacity: 0; } }
  #legenda { position: absolute; left: 50%; top: 22px; transform: translateX(-50%); max-width: 70%; padding: 9px 16px; border-radius: 999px;
    background: rgba(var(--ink), .9); border: 1px solid rgba(255,255,255,.12); font-size: 14px; color: var(--texto); z-index: 6;
    opacity: 0; transition: opacity .2s; pointer-events: none; text-align: center; }
  #legenda.ve { opacity: 1; }
  .confirma { display: flex; gap: 8px; margin-top: 10px; }
  .confirma button { flex: 1; height: 34px; border-radius: 10px; border: 1px solid rgba(255,255,255,.14); background: rgba(255,255,255,.06); color: var(--texto); font: inherit; cursor: pointer; }
  .confirma button.sim { background: color-mix(in srgb, var(--coral) 35%, transparent); border-color: color-mix(in srgb, var(--coral) 60%, transparent); }
  .confirma button:hover { filter: brightness(1.2); }

  /* ── os cartões soltos ─────────────────────────────────────────────────── */
  #cartoes { position: absolute; inset: 0; }
  /* A coluna da vez: os cartões de uma resposta, um embaixo do outro (rola se passar da tela). */
  .coluna { position: absolute; width: 400px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; overflow-x: visible;
    scrollbar-width: none; padding: 2px 0 24px; }
  .coluna::-webkit-scrollbar { display: none; }
  .cartao { position: relative; width: 400px; max-height: min(72vh, 620px); display: flex; flex-direction: column; flex: none; }
  .cartao.solto { position: absolute; }
  .cartao.arrastando { box-shadow: inset 0 1px 0 rgba(255,255,255,.14), 0 18px 40px rgba(0,0,0,.5); }
  .cartao .cab { display: flex; align-items: center; gap: 4px; padding: 7px 8px 6px 14px; cursor: grab; flex: none; }
  .cartao.arrastando .cab { cursor: grabbing; }
  .cartao .tit { flex: 1; min-width: 0; font-size: 12.5px; font-weight: 600; color: var(--a2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cartao .bt { width: 24px; height: 24px; border: 0; border-radius: 8px; background: transparent; cursor: pointer; display: grid; place-items: center; padding: 0; }
  .cartao .bt svg { width: 13px; height: 13px; fill: none; stroke: var(--apagado); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .cartao .bt:hover { background: rgba(255,255,255,.10); }
  .cartao .bt:hover svg { stroke: var(--texto); }
  .cartao.fixo { border-color: color-mix(in srgb, var(--a) 55%, rgba(255,255,255,.1)); }
  .cartao.fixo .bt.fix svg { stroke: var(--a2); fill: color-mix(in srgb, var(--a) 40%, transparent); }
  .cartao .corpo { padding: 2px 15px 13px; overflow-y: auto; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.18) transparent; overscroll-behavior: contain; }
  .cartao.mini { width: auto; max-width: 260px; }
  .cartao.mini .corpo { display: none; }
  .cartao.mini .cab { padding-bottom: 7px; }

  .vidro { border-radius: 18px; overflow: hidden;
    background: linear-gradient(180deg, rgba(var(--ink), .88), rgba(var(--ink), .94));
    border: 1px solid rgba(255,255,255,.11);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.14), 0 10px 28px rgba(0,0,0,.38);
    animation: entra .22s cubic-bezier(.2,.9,.3,1.15); }
  .vidro::before { content: ""; position: absolute; inset: 0; pointer-events: none; border-radius: inherit;
    background: linear-gradient(160deg, rgba(255,255,255,.10), rgba(255,255,255,0) 38%),
                radial-gradient(120% 60% at 0% 0%, color-mix(in srgb, var(--a) 16%, transparent), transparent 60%); }
  .vidro > * { position: relative; }
  .vidro.sai { animation: sai .16s ease forwards; }
  @keyframes entra { from { opacity: 0; transform: translateY(6px) scale(.975); } to { opacity: 1; transform: none; } }
  @keyframes sai { to { opacity: 0; transform: scale(.97); } }

  .pergunta { font-size: 12px; color: var(--apagado); margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .resp { white-space: pre-wrap; word-wrap: break-word; user-select: text; }
  .resp b { color: var(--a2); font-weight: 600; }
  .resp .cursor { display: inline-block; width: 7px; height: 14px; margin-left: 2px; vertical-align: -2px;
    background: var(--a); border-radius: 2px; animation: pisca 1s steps(2) infinite; }
  @keyframes pisca { 50% { opacity: 0; } }

  h3 { margin: 0 0 8px; font-size: 14px; font-weight: 600; color: var(--a2); letter-spacing: .01em; }
  p { margin: 0 0 6px; }
  ul, ol { margin: 4px 0 0; padding-left: 18px; }
  li { margin: 2px 0; }
  .esqueleto { height: 120px; border-radius: 12px; background: linear-gradient(90deg, rgba(255,255,255,.04) 20%, rgba(255,255,255,.10) 50%, rgba(255,255,255,.04) 80%);
    background-size: 220% 100%; animation: brilho 1.2s linear infinite; }
  @keyframes brilho { to { background-position: -220% 0; } }

  /* passos */
  .passos { list-style: none; padding: 0; counter-reset: p; }
  .passos li { display: flex; gap: 10px; margin: 0 0 8px; animation: entra .25s both; }
  .passos li::before { counter-increment: p; content: counter(p); flex: none; width: 22px; height: 22px; border-radius: 50%;
    display: grid; place-items: center; font-size: 12px; font-weight: 600; color: var(--bg); background: var(--a); }
  .passos small { display: block; color: var(--apagado); }

  /* linha do tempo */
  .tempo { position: relative; padding-left: 16px; }
  .tempo::before { content: ""; position: absolute; left: 4px; top: 4px; bottom: 4px; width: 2px; border-radius: 2px;
    background: linear-gradient(var(--a), var(--b)); }
  .tempo div { position: relative; margin-bottom: 8px; animation: entra .25s both; }
  .tempo div::before { content: ""; position: absolute; left: -16px; top: 6px; width: 10px; height: 10px; border-radius: 50%;
    background: var(--bg); border: 2px solid var(--a2); }
  .tempo b { color: var(--a2); margin-right: 6px; }

  /* barras */
  .barra { margin-bottom: 7px; }
  .barra .rot { display: flex; justify-content: space-between; font-size: 12px; color: var(--apagado); }
  .barra .trilho { height: 9px; border-radius: 6px; background: rgba(255,255,255,.07); overflow: hidden; }
  .barra .enche { height: 100%; border-radius: 6px; transform-origin: left; animation: enche .6s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes enche { from { transform: scaleX(0); } }

  /* tabela */
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  th { text-align: left; font-weight: 600; color: var(--a2); padding: 4px 6px; border-bottom: 1px solid rgba(255,255,255,.14); }
  td { padding: 5px 6px; border-bottom: 1px solid rgba(255,255,255,.06); }
  td:first-child { color: var(--apagado); }
  .sim { color: #7be0a6; font-weight: 700; } .nao { color: var(--coral); font-weight: 700; }

  /* fluxo */
  .fluxo { position: relative; display: flex; flex-direction: column; gap: 22px; align-items: center; padding: 4px 0; }
  .fluxo .camada { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .fluxo .no { position: relative; z-index: 1; padding: 6px 11px; border-radius: 10px; font-size: 12.5px; text-align: center; max-width: 170px;
    background: rgba(255,255,255,.07); border: 1px solid color-mix(in srgb, var(--cor, var(--a)) 60%, transparent); animation: entra .25s both; }
  .fluxo .no.redondo { border-radius: 999px; }
  .fluxo .no.losango { border-radius: 4px; transform: none; border-style: dashed; }
  .fluxo svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
  .fluxo path { fill: none; stroke: rgba(255,255,255,.28); stroke-width: 1.6; }
  .fluxo path.andando { stroke: var(--b); stroke-dasharray: 2 7; stroke-linecap: round; stroke-width: 2.6; animation: anda .7s linear infinite; }
  .fluxo text { fill: var(--apagado); font-size: 10.5px; }
  @keyframes anda { to { stroke-dashoffset: -9; } }

  /* diagrama */
  .diagrama svg { display: block; width: 100%; max-height: 250px; }
  .diagrama .orbita { transform-box: view-box; transform-origin: 0 0; animation: gira var(--t, 8s) linear infinite; }
  .diagrama .pulso { transform-box: fill-box; transform-origin: center; animation: pulsa 2.2s ease-in-out infinite; }
  .diagrama .gira { transform-box: fill-box; transform-origin: center; animation: gira 6s linear infinite; }
  .diagrama text { font-size: 9px; fill: var(--texto); paint-order: stroke; stroke: rgba(0,0,0,.6); stroke-width: 2.4px; stroke-linejoin: round; }
  @keyframes pulsa { 0%,100% { transform: scale(1); } 50% { transform: scale(1.09); } }
  @keyframes gira { to { transform: rotate(360deg); } }
  .legenda { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 6px; font-size: 12px; color: var(--apagado); }
  .legenda i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; vertical-align: 0; }

  /* 13/11: os cartões novos (foto, conta, quiz, modelo 3D, botões). */
  img.foto { display: block; width: 100%; max-height: 300px; object-fit: cover; border-radius: 12px; animation: entra .3s ease both; }
  .nota { margin: 8px 0 0; font-size: 12.5px; color: var(--apagado); }
  .conta .linha-conta { padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,.06); animation: entra .3s ease both; }
  .conta .expr { font: 600 16px/1.4 "Cascadia Mono", Consolas, monospace; color: var(--texto); }
  .conta .linha-conta:last-child .expr { color: var(--a2); }
  .pergunta-quiz { margin-bottom: 12px; }
  .enunciado { font-weight: 600; margin-bottom: 6px; }
  .opcoes { display: grid; gap: 6px; }
  .opcao, .acao { text-align: left; padding: 8px 11px; border-radius: 10px; border: 1px solid rgba(255,255,255,.12); background: rgba(255,255,255,.05); color: var(--texto); font: inherit; cursor: pointer; transition: background .15s, border-color .15s; }
  .opcao:hover, .acao:hover { background: rgba(255,255,255,.10); }
  .opcao.certa { border-color: #5fd18f; background: rgba(95,209,143,.18); }
  .opcao.errada { border-color: var(--coral); background: color-mix(in srgb, var(--coral) 18%, transparent); }
  .respondida .opcao { cursor: default; }
  .explica { margin-top: 6px; font-size: 12.5px; color: var(--apagado); animation: entra .25s ease both; }
  .placar { font-weight: 600; color: var(--a2); text-align: right; }
  .botoes-acao { display: flex; flex-wrap: wrap; gap: 6px; }
  .acao { flex: 1 1 auto; text-align: center; }
  canvas.modelo3d { display: block; width: 100%; height: 260px; }

  iframe.tela { width: 100%; height: 160px; border: 0; border-radius: 12px; display: block; background: transparent; }

  /* Movimento reduzido: pelo ajuste do ELYSIUM (Movimento), não direto pelo Windows — ver flutuante.js. */
  html.reduzir *, html.reduzir *::before, html.reduzir *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
</style>
</head>
<body>
<div id="palco">
  <svg id="marcas" aria-hidden="true"></svg>
  <div id="legenda" aria-live="polite"></div>
  <div id="cartoes"></div>
  <div id="ely">
    <div class="bola interativo" id="bola" title="Clique para escrever · segure e arraste para mover"><canvas id="bolota"></canvas></div>
    <div class="lado">
      <div class="linha1">
        <div class="nivel" id="nivel"><i></i><i></i><i></i><i></i><i></i></div>
        <div class="estado" id="estado"></div>
      </div>
      <input class="campo interativo" id="campo" placeholder="Pergunte à Ely…" maxlength="4000" spellcheck="false">
      <div class="fala" id="fala"><div id="aovivo"></div></div>
      <div class="balao interativo" id="balao"><div class="resp" id="balaoTexto"></div></div>
    </div>
  </div>
</div>
<script src="dashboard/js/temas-paleta.js"></script>
<script src="dashboard/js/esfera-logica.js"></script>
<script src="dashboard/js/flutuante.js"></script>
</body>
</html>
